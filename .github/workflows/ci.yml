name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  e2e-mock:
    name: e2e mock mode (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/mock-wallet.spec.ts
        working-directory: examples/demo-dapp
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-mock-${{ matrix.os }}
          path: examples/demo-dapp/playwright-report

  e2e-localnet:
    name: e2e rpc mode on Surfpool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: surfpool-linux-x64.tar.gz
            sha256: 5bef2b0b186a74622508f104b6d2e4e2db040932b6d8f3a811172e241f802a63
            bin: surfpool
          - os: macos-latest
            asset: surfpool-darwin-arm64.tar.gz
            sha256: 32c309e3b79bfa3913e384b3c9b109000720cfe7f346d145feb6693fccfb202f
            bin: surfpool
          - os: windows-latest
            asset: surfpool-windows-x64.tar.gz
            sha256: a7ba3c1440dd523810d5ad569145ed8e96c8e0be8ce91186a75903a4bab484f2
            bin: surfpool.exe
    env:
      SURFPOOL_VERSION: v1.7.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Surfpool from the official release, pinned by sha256
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/surfpool"
          cd "$RUNNER_TEMP/surfpool"
          curl -fsSL -o surfpool.tgz "https://github.com/solana-foundation/surfpool/releases/download/${SURFPOOL_VERSION}/${{ matrix.asset }}"
          if command -v sha256sum >/dev/null; then echo "${{ matrix.sha256 }}  surfpool.tgz" | sha256sum -c -; else echo "${{ matrix.sha256 }}  surfpool.tgz" | shasum -a 256 -c -; fi
          tar -xzf surfpool.tgz
          echo "SURFPOOL_BIN=$RUNNER_TEMP/surfpool/${{ matrix.bin }}" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test -w @solana-e2e/playwright
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/localnet.spec.ts
        working-directory: examples/demo-dapp
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-localnet-${{ matrix.os }}
          path: examples/demo-dapp/playwright-report
