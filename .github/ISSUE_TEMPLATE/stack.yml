name: My dApp stack is not covered
description: The test wallet does not work with your wallet library or framework.
labels: [compatibility]
body:
  - type: input
    id: stack
    attributes:
      label: Wallet library and framework
      placeholder: "@solana/react + Next.js 16, wallet-adapter, ConnectorKit…"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What fails?
      description: Does the dApp list the wallet? Does connect work? Which call fails, with which error?
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Public repo or minimal example (if you can)
