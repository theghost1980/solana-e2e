# Netlify builds the landing page and playground in apps/site. Deploy previews come from pull requests.
[build]
  base = "/"
  command = "npm run build -w @solana-e2e/wallet && npm run build -w site"
  publish = "apps/site/dist"

[build.environment]
  NODE_VERSION = "22"
  # No dependency needs an install script to build the site.
  NPM_FLAGS = "--ignore-scripts"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Netlify serves 404.html for unknown paths on its own. Only the bare /es needs a hand.
[[redirects]]
  from = "/es"
  to = "/es/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
